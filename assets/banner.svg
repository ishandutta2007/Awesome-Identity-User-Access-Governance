<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070c1a" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a18cd1" />
      <stop offset="100%" stop-color="#fbc2eb" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="radialCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radialPurple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.04); }
    }
    @keyframes dashTravel {
      to { stroke-dashoffset: -120; }
    }
    @keyframes floatPillSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatPillOpposite {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(7px); }
    }
    @keyframes ringRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .pulsing-glow {
      animation: pulseGlow 6s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .data-flow-1 {
      stroke-dasharray: 10, 14;
      animation: dashTravel 4s linear infinite;
    }
    .data-flow-2 {
      stroke-dasharray: 8, 12;
      animation: dashTravel 3.2s linear infinite reverse;
    }
    .pill-floating-1 {
      animation: floatPillSlow 5s ease-in-out infinite;
    }
    .pill-floating-2 {
      animation: floatPillOpposite 5.5s ease-in-out infinite;
    }
    .pill-floating-3 {
      animation: floatPillSlow 6.2s ease-in-out infinite;
    }
    .rotating-orbit {
      animation: ringRotate 24s linear infinite;
      transform-origin: 1060px 100px;
    }
  </style>

  <!-- Deep Base Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGradient)" />

  <!-- Ambient Glow Pods -->
  <circle cx="240" cy="140" r="280" fill="url(#radialCyan)" class="pulsing-glow" />
  <circle cx="980" cy="280" r="300" fill="url(#radialPurple)" class="pulsing-glow" />

  <!-- Tech Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#cyberGrid)" />

  <!-- Dynamic Circuit Flow Lines (Background Decoration) -->
  <g opacity="0.45">
    <path d="M 60,80 L 320,80 L 420,160 L 780,160 L 860,80 L 1140,80" fill="none" stroke="#0284c7" stroke-width="2" />
    <path d="M 60,80 L 320,80 L 420,160 L 780,160 L 860,80 L 1140,80" fill="none" stroke="#38bdf8" stroke-width="2.5" class="data-flow-1" filter="url(#softGlow)" />

    <path d="M 100,350 L 380,350 L 480,270 L 740,270 L 840,350 L 1100,350" fill="none" stroke="#6366f1" stroke-width="2" />
    <path d="M 100,350 L 380,350 L 480,270 L 740,270 L 840,350 L 1100,350" fill="none" stroke="#a5b4fc" stroke-width="2.5" class="data-flow-2" filter="url(#softGlow)" />

    <!-- Connecting vertical bus ticks -->
    <circle cx="320" cy="80" r="4" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="860" cy="80" r="4" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="380" cy="350" r="4" fill="#818cf8" filter="url(#softGlow)" />
    <circle cx="840" cy="350" r="4" fill="#818cf8" filter="url(#softGlow)" />
  </g>

  <!-- Interactive/Dynamic Feature Pills (Positioned around borders to never hide title/subtitle) -->
  <!-- Top Right Floating Pill -->
  <g class="pill-floating-1" transform="translate(860, 36)">
    <rect width="260" height="36" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2" filter="url(#softGlow)" />
    <circle cx="22" cy="18" r="5" fill="#10b981" />
    <text x="36" y="23" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.3">
      Zero Trust &amp; Least Privilege
    </text>
  </g>

  <!-- Top Left Floating Pill -->
  <g class="pill-floating-2" transform="translate(80, 36)">
    <rect width="250" height="36" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.2" filter="url(#softGlow)" />
    <circle cx="22" cy="18" r="5" fill="#38bdf8" />
    <text x="36" y="23" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.3">
      Continuous Access Reviews
    </text>
  </g>

  <!-- Bottom Left Floating Pill -->
  <g class="pill-floating-3" transform="translate(80, 348)">
    <rect width="240" height="36" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2" filter="url(#softGlow)" />
    <circle cx="20" cy="18" r="5" fill="#f59e0b" />
    <text x="34" y="23" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.3">
      JIT &amp; Privileged Governance
    </text>
  </g>

  <!-- Bottom Right Floating Pill -->
  <g class="pill-floating-1" transform="translate(870, 348)">
    <rect width="250" height="36" rx="18" fill="#0f172a" fill-opacity="0.85" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.2" filter="url(#softGlow)" />
    <circle cx="20" cy="18" r="5" fill="#10b981" />
    <text x="34" y="23" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.3">
      SOX • HIPAA • ISO 27001
    </text>
  </g>

  <!-- Top Right Geometric Orbit Accent -->
  <g class="rotating-orbit" opacity="0.35">
    <circle cx="1060" cy="100" r="42" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6, 8" />
    <circle cx="1102" cy="100" r="4" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Shield, Typography (Fixed & Fully Visible in Foreground) -->
  <g id="foreground-content">
    <!-- Center Shield / Vault Icon -->
    <g transform="translate(600, 118)">
      <!-- Outer glow ring -->
      <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="url(#accentCyan)" stroke-width="2.5" filter="url(#softGlow)" />
      <!-- Shield silhouette -->
      <path d="M 0,-20 L 16,-12 C 16,10 0,22 0,22 C 0,22 -16,10 -16,-12 Z" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round" />
      <!-- Keyhole / checkmark inside shield -->
      <circle cx="0" cy="-3" r="3.5" fill="#ffffff" />
      <path d="M -2,0 L 2,0 L 3,9 L -3,9 Z" fill="#ffffff" />
    </g>

    <!-- Main Title -->
    <text x="600" y="202" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="37" font-weight="800" fill="url(#titleGradient)" letter-spacing="-0.5" filter="url(#softGlow)">
      Awesome Identity &amp; User Access Governance
    </text>

    <!-- Subtitle -->
    <text x="600" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Ecosystem of Enterprise SaaS Platforms &amp; Open-Source IGA Solutions
    </text>

    <!-- Center Badges / Tags Bar -->
    <g transform="translate(600, 282)">
      <!-- Badge container box -->
      <rect x="-320" y="-16" width="640" height="32" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#38bdf8" letter-spacing="0.6">
        IDENTITY LIFECYCLE  •  ACCESS CERTIFICATION  •  LEAST PRIVILEGE  •  SCIM &amp; RBAC/ABAC
      </text>
    </g>
  </g>

  <!-- Outer Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="15.5" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.8" />
</svg>
